<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PDF Text Editor</title>
  </head>
  <body>
    <header class="toolbar">
      <label class="button primary">Open PDF<input id="pdf-input" type="file" accept="application/pdf" /></label>
      <button id="save-button" type="button">Download PDF</button>
      <span id="status">Choose a PDF to begin.</span>
    </header>
    <main class="workspace">
      <section class="viewer-panel">
        <div class="viewer-scroll">
          <div id="page-inner">
            <canvas id="pdf-canvas"></canvas>
            <canvas id="mask-canvas"></canvas>
            <div id="text-layer"></div>
          </div>
        </div>
      </section>
      <aside class="inspector">
        <h1>Text editor</h1>
        <textarea id="text-value" placeholder="Select text in the PDF"></textarea>
        <button id="apply-button" type="button">Apply text</button>
      </aside>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
